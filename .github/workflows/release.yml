name: Release

on:
  issues:
    types: [labeled]

permissions:
  contents: read
  id-token: write
  issues: write
  pull-requests: read
  checks: read
  statuses: read

jobs:
  prepare:
    if: github.event.label.name == 'release:prepare'
    uses: connectbot/actions/.github/workflows/prepare-release.yml@afbe5170d337a112404df279d64fb3cdf0d6b1ee # v0.2.1
    with:
      tag_prefix: v
      gradle_no_push_prop: release.noPush

  publish:
    if: github.event.label.name == 'release:publish'
    uses: connectbot/actions/.github/workflows/publish-release.yml@afbe5170d337a112404df279d64fb3cdf0d6b1ee # v0.2.1
    with:
      tag_prefix: v

  branch:
    if: github.event.label.name == 'release:branch'
    uses: connectbot/actions/.github/workflows/release-branch.yml@afbe5170d337a112404df279d64fb3cdf0d6b1ee # v0.2.1
