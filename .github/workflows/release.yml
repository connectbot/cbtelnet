name: Release

on:
  issues:
    types: [labeled]

permissions:
  contents: read
  id-token: write
  issues: write
  pull-requests: read
  checks: read
  statuses: read

jobs:
  prepare:
    if: github.event.label.name == 'release:prepare'
    uses: connectbot/actions/.github/workflows/prepare-release.yml@cc0b592a30eec76cc6c1e7c969cd70658b77a966 # v0.2.2
    with:
      tag_prefix: v
      gradle_no_push_prop: release.noPush

  publish:
    if: github.event.label.name == 'release:publish'
    uses: connectbot/actions/.github/workflows/publish-release.yml@cc0b592a30eec76cc6c1e7c969cd70658b77a966 # v0.2.2
    with:
      tag_prefix: v

  branch:
    if: github.event.label.name == 'release:branch'
    uses: connectbot/actions/.github/workflows/release-branch.yml@cc0b592a30eec76cc6c1e7c969cd70658b77a966 # v0.2.2
